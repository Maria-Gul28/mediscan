# fly.toml app configuration file generated for mediscan-api on 2026-09-14T21:35:42+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mediscan-api'
primary_region = 'sin'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
